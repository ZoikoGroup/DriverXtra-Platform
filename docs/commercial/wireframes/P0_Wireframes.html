<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriverXtra P0 Wireframes</title>
<style>
:root{
  --bg:#f4f5f7;--panel:#ffffff;--ink:#152231;--muted:#5b6673;--line:#d5dae0;--soft:#eceff2;--wire:#fbfbfc;
  --accent:#c98a1a;--accent-ink:#ffffff;--accent-soft:#fff6e9;
  --ok:#2f7d4f;--ok-soft:#e7f4ec;--warn:#9a6200;--warn-soft:#fff3db;--off:#8a3b3b;--off-soft:#f8e9e9;--info:#2d5d8a;--info-soft:#e7f0f8;
  --radius:10px;--shadow:0 1px 2px rgba(21,34,49,.06),0 4px 16px rgba(21,34,49,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a;--panel:#161d25;--ink:#e6ebf0;--muted:#9aa6b2;--line:#2a3440;--soft:#1d2630;--wire:#131a21;
  --accent:#e0a23a;--accent-ink:#1a1206;--accent-soft:#2a2213;
  --ok:#6cc392;--ok-soft:#14261c;--warn:#e7b459;--warn-soft:#2a2210;--off:#e39191;--off-soft:#2a1717;--info:#8fbbe6;--info-soft:#13202d;
}}
:root[data-theme="dark"]{
  --bg:#0f141a;--panel:#161d25;--ink:#e6ebf0;--muted:#9aa6b2;--line:#2a3440;--soft:#1d2630;--wire:#131a21;
  --accent:#e0a23a;--accent-ink:#1a1206;--accent-soft:#2a2213;
  --ok:#6cc392;--ok-soft:#14261c;--warn:#e7b459;--warn-soft:#2a2210;--off:#e39191;--off-soft:#2a1717;--info:#8fbbe6;--info-soft:#13202d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.toc{background:var(--panel);border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-weight:400;color:var(--muted);letter-spacing:0}
.toc input{width:100%;margin:12px 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.wf{margin:14px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.toc a{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:6px;text-decoration:none;font-size:13px}
.toc a:hover{background:var(--soft)}
.toc a.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.toc a code{font-size:11px;color:var(--muted);min-width:52px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--off);display:inline-block;flex:none;align-self:center}
main{padding:20px 24px 60px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.title h1{margin:0;font-size:20px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--panel)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.prop{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.off{background:var(--off-soft);color:var(--off);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.layout>div{min-width:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.stage{background:var(--soft);border-radius:var(--radius);padding:18px;display:flex;justify-content:center;overflow:auto}
.frame{background:var(--wire);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:1080px;overflow:hidden}
.frame.mobile{max-width:390px}
.spec{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.spec h3{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.spec h3:first-child{margin-top:0}
.spec ul{margin:0;padding-left:18px}
.spec li{margin:3px 0}
.spec li.hl{background:var(--accent-soft);border-radius:4px;padding:1px 4px;margin-left:-4px}
.api{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:start;margin:4px 0;font-size:12.5px}
.api code{word-break:break-all}
.gate{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:var(--off-soft);color:var(--off);font-weight:600}
/* wireframe primitives */
.w-nav{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.w-logo{font-weight:800;letter-spacing:.04em}
.w-logo span{color:var(--accent)}
.w-links{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.w-links button,.lnk{border:0;background:transparent;padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--muted)}
.w-links button:hover,.lnk:hover{background:var(--soft);color:var(--ink)}
.w-links button.cur{color:var(--ink);background:var(--soft);font-weight:600}
.w-market{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;white-space:nowrap}
.hamb{display:none;width:28px;height:20px;border:1px solid var(--line);border-radius:4px}
.w-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.w-shell{display:grid;grid-template-columns:180px 1fr}
.w-side{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.w-side button{text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--muted)}
.w-side button:hover{background:var(--soft);color:var(--ink)}
.w-h{font-size:18px;font-weight:700}
.w-search{display:flex;gap:8px}
.w-search div{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--muted);background:var(--panel)}
.box{border:1px dashed var(--line);border-radius:8px;background:var(--panel);padding:10px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.card .img{height:70px;background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 6px,var(--wire) 6px,var(--wire) 12px)}
.card .t{padding:8px}
.ln{height:8px;border-radius:4px;background:var(--line);margin:6px 0}
.ln.s{width:55%}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
.split.f{grid-template-columns:200px minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.field{margin:8px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.field div{border:1px solid var(--line);border-radius:6px;height:32px;background:var(--wire)}
table.w{width:100%;border-collapse:collapse;font-size:12px}
table.w th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px}
table.w td{border-bottom:1px solid var(--soft);padding:8px 6px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.dis{opacity:.5;cursor:not-allowed;text-decoration:line-through}
.banner{border-radius:8px;padding:8px 10px;font-size:13px}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.warn,.banner.pending{background:var(--warn-soft);color:var(--warn)}
.banner.disabled{background:var(--off-soft);color:var(--off)}
.banner b{margin-right:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs span{padding:6px 10px;font-size:13px;color:var(--muted)}
.tabs span:first-child{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent);font-weight:600}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid var(--line)}
.steps span.done{background:var(--soft)}
.steps span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel)}
.kpi b{display:block;font-size:20px}
.sum div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--soft);font-size:13px}
.sum div:last-child{font-weight:700;border:0}
.sum div.note{color:var(--muted);font-weight:400;font-size:12px}
.tl{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.tl span{padding:3px 8px;border:1px solid var(--line);border-radius:6px}
.tl i{color:var(--muted);font-style:normal}
.gal{height:170px;border-radius:8px;background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 8px,var(--wire) 8px,var(--wire) 16px);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:6px}
.chat div{max-width:75%;border-radius:10px;padding:8px;background:var(--soft);font-size:12px}
.chat div.me{align-self:flex-end;background:var(--accent-soft)}
.bottom{display:none}
/* mobile frame */
.frame.mobile .w-links,.frame.mobile .w-market{display:none}
.frame.mobile .hamb{display:inline-block;margin-left:auto}
.frame.mobile .split,.frame.mobile .split.f,.frame.mobile .w-shell{grid-template-columns:minmax(0,1fr)}
.w-body{min-width:0}
.frame.mobile .w-side{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}
.frame.mobile .w-side button{white-space:nowrap}
.frame.mobile .bottom{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--panel);padding:8px 0;position:sticky;bottom:0}
.frame.mobile .bottom button{border:0;background:transparent;font-size:11px;color:var(--muted);cursor:pointer}
.frame.mobile table.w th:nth-child(n+4),.frame.mobile table.w td:nth-child(n+4){display:none}
.legend{font-size:12px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;margin-top:14px}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}.spec{position:static;max-height:none}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}.toc{position:static;height:auto;max-height:45vh}main{padding:16px}.stage{padding:8px}.frame.mobile{max-width:min(390px,100%)}.title h1{font-size:18px}.chip{white-space:normal}}
</style>
</head>
<body>
<div class="app">
  <nav class="toc" aria-label="Screens">
    <div class="brand">DRIVER<span style="color:var(--accent)">XTRA</span> · P0 wireframes<small>0.1 DRAFT · low fidelity · not an approved design</small></div>
    <input id="q" type="search" placeholder="Filter screens (ID, title, role)" aria-label="Filter screens">
    <div id="toclist"></div>
    <p class="legend"><span class="dot"></span> gated or approval-pending screen</p>
  </nav>
  <main>
    <div class="bar">
      <div class="title"><h1 id="st"></h1><div class="meta" id="sm"></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div class="seg" role="group" aria-label="Market"><button data-m="US">USA · USD</button><button data-m="UK">UK · GBP</button></div>
        <div class="seg" role="group" aria-label="Viewport"><button data-v="desktop">Desktop</button><button data-v="mobile">Mobile</button></div>
        <div class="seg" role="group" aria-label="Theme"><button data-t="light">Light</button><button data-t="dark">Dark</button></div>
      </div>
    </div>
    <div class="layout">
      <div>
        <div class="stage"><div class="frame" id="frame"></div></div>
        <div class="pager"><button class="btn" id="prev">← Previous</button><button class="btn" id="next">Next →</button></div>
      </div>
      <aside class="spec" id="spec" aria-label="Screen specification"></aside>
    </div>
  </main>
</div>

{ const u = new URLSearchParams(location.search); if (u.get('v')) st.v = u.get('v'); if (u.get('m')) st.m = u.get('m').toUpperCase() === 'UK' ? 'UK' : 'US'; }
