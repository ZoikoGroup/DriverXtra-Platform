version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: driverxtra_db
    restart: always
    environment:
      POSTGRES_DB: driverxtra_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d driverxtra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: driverxtra_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-docker-compose-driverxtra-phase1-key
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=driverxtra_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
